<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="editorialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="100" height="100" fill="#050505"/>
  
  <!-- Minimalist Thin Framing Corners -->
  <path d="M 16 28 L 16 16 L 28 16" fill="none" stroke="#27272a" stroke-width="2"/>
  <path d="M 84 72 L 84 84 L 72 84" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- High-Fashion Editorial Serif Monogram -->
  <text 
    x="52%" 
    y="53%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="Didot, 'Bodoni MT', 'Times New Roman', serif" 
    font-size="46" 
    font-weight="normal" 
    font-style="italic" 
    fill="url(#editorialGradient)" 
    letter-spacing="-2">
    SD
  </text>
</svg>
